schema_version: 1
experiment_name: agenticls_closed_loop_audit

depths:
  primary: 2
  secondary: [1, 3]

trajectory:
  max_candidates: 40
  checkpoints: [5, 10, 20, 40]

seeds:
  values: [11, 22, 33, 44, 55]
  count: 5

online_validation:
  fraction: 0.25
  cumulative_allowances:
    5: 2
    10: 3
    20: 5
    40: 10

fixed_multistage:
  random_phase: {start: 1, end: 16, count: 16}
  greedy_phase: {start: 17, end: 32, count: 16}
  beam_phase: {start: 33, end: 40, count: 8}

control_partition:
  method: sha256_sorted
  assignment_seed: 42
  discovery_seed: 100
  validation_seed: 200
  confirmation_seed: 300
  discovery_fraction: 0.25
  validation_fraction: 0.25
  confirmation_fraction: 0.50
  minimum_discovery: 4
  minimum_validation: 4
  minimum_confirmation: 8

random_policy:
  method: position_balanced_without_replacement

accounting:
  candidate_evaluations_are_budgeted: true
  validation_actions_are_budgeted: true
  raw_uncached_model_calls_are_reported: true
  shared_control_embeddings_may_be_cached: true

statistics:
  independent_unit: gene
  primary_endpoint: confirmed_AUDC
  seed_aggregation: within_gene_mean
  uncertainty: paired_gene_clustered_bootstrap

smoke_test:
  development_genes: 5
  required_policies: [random, fixed_multistage, auditor]

